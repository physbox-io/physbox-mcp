[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physbox-mcp"
version = "0.23.0"
description = "PhysBox: MCP - Server for local simulation apps"
readme = "README.md"
authors = [
    {name = "Tom Grek", email = "tom.grek@gmail.com"}
]
requires-python = ">=3.12"
license = "LicenseRef-PPPL-1.0"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>=2.0.0",
    "websockets>=12.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# The two things testable without a browser attached, both needing nothing but
# pytest: the cloud client (tests/test_cloud.py) and the agent-facing docs
# (tests/test_docs.py), which are read off disk and checked against the tools
# this server registers.
test = ["pytest>=8.0"]

[project.scripts]
physbox-mcp = "physbox_mcp.server:main"

[tool.setuptools]
packages = ["physbox_mcp"]

[tool.setuptools.package-data]
physbox_mcp = ["mcp-docs/*.json"]
