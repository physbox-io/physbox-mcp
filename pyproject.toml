[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physbox-mcp"
version = "0.5.1"
description = "PhysBox: MCP - Server for local simulation apps"
readme = "README.md"
authors = [
    {name = "Tom Grek", email = "tom.grek@gmail.com"}
]
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastmcp>=2.0.0",
    "websockets>=12.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
physbox-mcp = "physbox_mcp.server:main"

[tool.setuptools]
packages = ["physbox_mcp"]

[tool.setuptools.package-data]
physbox_mcp = ["mcp-docs/*.json"]
